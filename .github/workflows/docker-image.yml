name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]  # 当推送到 main 分支时触发，如果是 master 分支请修改为 master
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. 检出代码
    - name: Checkout code
      uses: actions/checkout@v3

    # 2. 设置 Docker Buildx (构建工具)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    # 3. 登录 Docker Hub (需要你在 GitHub 仓库设置 Secrets)
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 4. 构建并推送镜像
    - name: Build and push
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile
        push: true
        # 注意：下面的 wdsc-app 是镜像名，你可以修改为你喜欢的名字
        # ${{ secrets.DOCKERHUB_USERNAME }} 会自动替换为你的用户名
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/wdsc-app:latest
