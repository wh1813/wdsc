name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]  # 如果你的主分支叫 master，请把这里改成 master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. 下载代码
    - name: Checkout code
      uses: actions/checkout@v3

    # 2. 设置构建环境
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    # 3. 登录 Docker Hub
    # 注意：你仍然需要在 GitHub 仓库设置里添加 Secrets (DOCKERHUB_USERNAME 和 DOCKERHUB_TOKEN)
    # 这里的 username 必须对应你的 Docker Hub 用户名 loko219
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 4. 构建并推送
    - name: Build and push
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile
        push: true
        # 这里直接使用了你指定的镜像名，标签设为 latest
        tags: loko219/wdsc:latest
